<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HungryBites - Admin Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .auth-container {
            max-width: 450px;
            width: 90%;
            background: white;
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .logo {
            text-align: center;
            font-size: 2.5rem;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 0.5rem;
        }

        .tagline {
            text-align: center;
            color: #666;
            margin-bottom: 2rem;
            font-size: 0.9rem;
        }

        h2 {
            margin-bottom: 2rem;
            color: #333;
            text-align: center;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: #333;
        }

        .form-group input {
            width: 100%;
            padding: 1rem;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #2c3e50;
        }

        .btn {
            width: 100%;
            padding: 1rem;
            background: #2c3e50;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 1rem;
        }

        .btn:hover {
            background: #34495e;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(44, 62, 80, 0.4);
        }

        .btn:disabled {
            background: #95a5a6;
            cursor: not-allowed;
            transform: none;
        }

        .back-link {
            text-align: center;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid #e0e0e0;
        }

        .back-link a {
            color: #fc8019;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        .error {
            color: #e74c3c;
            margin-top: 1rem;
            text-align: center;
            font-size: 0.9rem;
            background: #fadbd8;
            padding: 0.8rem;
            border-radius: 8px;
            display: none;
        }

        .success {
            color: #27ae60;
            margin-top: 1rem;
            text-align: center;
            font-size: 0.9rem;
            background: #d4edda;
            padding: 0.8rem;
            border-radius: 8px;
            display: none;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 1rem;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #2c3e50;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .auth-tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            background: #f1f5f9;
            padding: 0.35rem;
            border-radius: 12px;
        }

        .auth-tab {
            flex: 1;
            padding: 0.75rem;
            border: none;
            background: transparent;
            font-size: 0.95rem;
            font-weight: 600;
            color: #64748b;
            cursor: pointer;
            border-radius: 9px;
            transition: all 0.25s;
        }

        .auth-tab.active {
            background: white;
            color: #2c3e50;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .toggle-auth-text {
            text-align: center;
            margin-top: 1.25rem;
            font-size: 0.9rem;
            color: #64748b;
        }

        .toggle-auth-text a {
            color: #2c3e50;
            font-weight: 600;
            text-decoration: underline;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="logo">🔐 TIU Admin Panel</div>
        <div class="tagline">HungryBites Administration</div>
        
        <div class="auth-tabs">
            <button type="button" class="auth-tab active" id="tabLogin" onclick="switchAuthMode('login')">Admin Login</button>
            <button type="button" class="auth-tab" id="tabSignup" onclick="switchAuthMode('signup')">Sign Up as Admin</button>
        </div>

        <h2 id="formTitle">Admin Login</h2>
        
        <!-- LOGIN FORM -->
        <form id="adminLoginForm" onsubmit="handleAdminLogin(event)">
            <div class="form-group">
                <label>Admin Email</label>
                <input type="email" id="adminEmail" placeholder="Enter admin email" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="adminPassword" placeholder="Enter password" required>
            </div>
            <button type="submit" class="btn" id="loginBtn">Login as Admin</button>
            <div class="toggle-auth-text">
                Don't have an admin account? <a onclick="switchAuthMode('signup')">Sign up as Admin</a>
            </div>
        </form>

        <!-- SIGNUP FORM -->
        <form id="adminSignupForm" onsubmit="handleAdminSignup(event)" style="display: none;">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="signupName" placeholder="Enter full name" required>
            </div>
            <div class="form-group">
                <label>Admin Email</label>
                <input type="email" id="signupEmail" placeholder="Enter admin email" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="signupPassword" placeholder="Create password (min 6 characters)" minlength="6" required>
            </div>
            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" id="signupConfirmPassword" placeholder="Confirm password" minlength="6" required>
            </div>
            <button type="submit" class="btn" id="signupBtn">Sign Up as Admin</button>
            <div class="toggle-auth-text">
                Already registered? <a onclick="switchAuthMode('login')">Back to Login</a>
            </div>
        </form>

        <div class="loading" id="loading">
            <div class="spinner"></div>
        </div>

        <div class="back-link">
            <a href="index.html">← Back to User Login</a>
        </div>

        <div class="error" id="authError"></div>
        <div class="success" id="authSuccess"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";
        import { getDatabase, ref, get, child, set } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCTB7d1-tjzU3DG0tvmkh1lWiZcmba10XI",
            authDomain: "hungrybites-c7930.firebaseapp.com",
            projectId: "hungrybites-c7930",
            storageBucket: "hungrybites-c7930.firebasestorage.app",
            messagingSenderId: "346758544945",
            appId: "1:346758544945:web:4bcad30016540d18e79f10",
            measurementId: "G-B5GP5SYMRC",
            databaseURL: "https://hungrybites-c7930-default-rtdb.firebaseio.com"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        setPersistence(auth, browserLocalPersistence).catch(err => console.warn('Auth persistence error:', err));
        const database = getDatabase(app);

        let isAuthenticating = false;

        // Auto-login: if admin is already logged in, redirect to dashboard
        onAuthStateChanged(auth, async (user) => {
            if (user && !isAuthenticating) {
                try {
                    const dbRef = ref(database);
                    const snapshot = await get(child(dbRef, `tiutbc/admins/${user.uid}`));
                    if (snapshot.exists()) {
                        const adminData = snapshot.val();
                        const isAdminGranted = adminData.admin === true || adminData.isAdmin === true || adminData.isadmin === true;
                        if (isAdminGranted) {
                            showSuccess(`Welcome back ${adminData.name || 'Admin'}! Auto-logging in...`);
                            const adminInfo = JSON.stringify({
                                uid: user.uid,
                                email: adminData.email,
                                name: adminData.name,
                                role: adminData.role
                            });
                            sessionStorage.setItem('adminData', adminInfo);
                            localStorage.setItem('adminData', adminInfo);
                            setTimeout(() => {
                                window.location.href = 'admin.html';
                            }, 800);
                        }
                    }
                } catch (err) {
                    console.warn('Auto-login error:', err);
                }
            }
        });

        window.switchAuthMode = function(mode) {
            hideMessages();
            const isLogin = mode === 'login';
            document.getElementById('tabLogin').classList.toggle('active', isLogin);
            document.getElementById('tabSignup').classList.toggle('active', !isLogin);
            document.getElementById('formTitle').textContent = isLogin ? 'Admin Login' : 'Sign Up as Admin';
            document.getElementById('adminLoginForm').style.display = isLogin ? 'block' : 'none';
            document.getElementById('adminSignupForm').style.display = isLogin ? 'none' : 'block';
        };

        window.handleAdminLogin = async function(e) {
            e.preventDefault();
            const email = document.getElementById('adminEmail').value;
            const password = document.getElementById('adminPassword').value;

            hideMessages();
            showLoading(true);
            isAuthenticating = true;

            try {
                // First authenticate with Firebase Auth
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // Then check if user is admin in Realtime Database
                const dbRef = ref(database);
                const snapshot = await get(child(dbRef, `tiutbc/admins/${user.uid}`));
                
                if (snapshot.exists()) {
                    const adminData = snapshot.val();
                    
                    // Check if admin flag is true
                    const isAdminGranted = adminData.admin === true || adminData.isAdmin === true || adminData.isadmin === true;
                    if (isAdminGranted) {
                        showSuccess(`Welcome ${adminData.name || 'Admin'}! Redirecting to dashboard...`);
                        
                        // Store admin info for the dashboard
                        const adminInfo = JSON.stringify({
                            uid: user.uid,
                            email: adminData.email,
                            name: adminData.name,
                            role: adminData.role
                        });
                        sessionStorage.setItem('adminData', adminInfo);
                        localStorage.setItem('adminData', adminInfo);
                        
                        setTimeout(() => {
                            window.location.href = 'admin.html';
                        }, 1000);
                    } else {
                        // Admin flag is false or doesn't exist
                        await signOut(auth);
                        isAuthenticating = false;
                        showLoading(false);
                        showError('Access denied. Admin privileges not granted.');
                    }
                } else {
                    // User not found in admins database
                    await signOut(auth);
                    isAuthenticating = false;
                    showLoading(false);
                    showError('Access denied. You are not an admin.');
                }
            } catch (error) {
                isAuthenticating = false;
                showLoading(false);
                let errorMessage = 'An error occurred. Please try again.';
                
                if (error.code === 'auth/invalid-email') {
                    errorMessage = 'Invalid email address.';
                } else if (error.code === 'auth/user-not-found') {
                    errorMessage = 'Admin account not found.';
                } else if (error.code === 'auth/wrong-password') {
                    errorMessage = 'Incorrect password.';
                } else if (error.code === 'auth/invalid-credential') {
                    errorMessage = 'Invalid credentials. Please check your email and password.';
                } else if (error.code === 'auth/too-many-requests') {
                    errorMessage = 'Too many failed attempts. Please try again later.';
                }
                
                showError(errorMessage);
            }
        };

        window.handleAdminSignup = async function(e) {
            e.preventDefault();
            const name = document.getElementById('signupName').value.trim();
            const email = document.getElementById('signupEmail').value.trim();
            const password = document.getElementById('signupPassword').value;
            const confirmPassword = document.getElementById('signupConfirmPassword').value;

            hideMessages();

            if (password !== confirmPassword) {
                showError('Passwords do not match.');
                return;
            }

            if (password.length < 6) {
                showError('Password must be at least 6 characters.');
                return;
            }

            showLoading(true);
            isAuthenticating = true;

            try {
                // Create user in Firebase Auth
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // Create user ID entry under tiutbc/admins with isadmin = false
                await set(ref(database, `tiutbc/admins/${user.uid}`), {
                    uid: user.uid,
                    name: name,
                    email: email,
                    admin: false,
                    isAdmin: false,
                    isadmin: false,
                    createdAt: Date.now()
                });

                // Immediately sign out so unauthorized user cannot access
                await signOut(auth);
                isAuthenticating = false;

                showLoading(false);
                document.getElementById('adminSignupForm').reset();
                showSuccess('Admin registration submitted. Your account is pending verification.');
                setTimeout(() => {
                    switchAuthMode('login');
                }, 2000);
            } catch (error) {
                isAuthenticating = false;
                showLoading(false);
                let errorMessage = 'An error occurred during registration. Please try again.';
                if (error.code === 'auth/email-already-in-use') {
                    errorMessage = 'This email is already registered.';
                } else if (error.code === 'auth/invalid-email') {
                    errorMessage = 'Invalid email address.';
                } else if (error.code === 'auth/weak-password') {
                    errorMessage = 'Password is too weak. Please use at least 6 characters.';
                }
                showError(errorMessage);
            }
        };

        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
            const loginBtn = document.getElementById('loginBtn');
            const signupBtn = document.getElementById('signupBtn');
            if (loginBtn) loginBtn.disabled = show;
            if (signupBtn) signupBtn.disabled = show;
        }

        function showError(message) {
            const errorEl = document.getElementById('authError');
            errorEl.textContent = message;
            errorEl.style.display = 'block';
        }

        function showSuccess(message) {
            showLoading(false);
            const successEl = document.getElementById('authSuccess');
            successEl.textContent = message;
            successEl.style.display = 'block';
        }

        function hideMessages() {
            document.getElementById('authError').style.display = 'none';
            document.getElementById('authSuccess').style.display = 'none';
        }
    </script>
</body>
</html>
